# Mosquitto MQTT Broker Configuration for Meshtastic T-beam
# Basic configuration for local WLAN connection

# Basic broker settings
listener 1883 0.0.0.0

# Security settings (basic)
allow_anonymous true

# Logging configuration
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Persistence settings
persistence true
persistence_location C:/ProgramData/mosquitto/
persistence_file mosquitto.db
autosave_interval 1800

# Connection settings
max_connections -1
max_queued_messages 1000
max_inflight_messages 20
queue_qos0_messages true

# System monitoring
sys_interval 10
connection_messages true


# Connection to test.mosquitto.org (Broker Bridge)
connection test-mosquitto-bridge
address test.mosquitto.org:1883
bridge_protocol_version mqttv311
cleansession false
try_private false

# Forward all messages from the public Meshtastic topics
# Adjust the root topic based on your Meshtastic configuration
topic msh/us/tx/llam/bit/2/e/Public in 0
topic $SYS/broker/clients/total in 0
