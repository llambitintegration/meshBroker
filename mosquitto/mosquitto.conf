# Mosquitto MQTT Broker Configuration for Meshtastic Integration

# Basic broker settings
listener 1883 0.0.0.0
protocol mqtt

# System settings
sys_interval 10
connection_messages true
log_timestamp true
log_type all

# Allow anonymous connections (for development)
# For production, use password authentication
allow_anonymous true

# Persistence
persistence true
persistence_location /tmp/mosquitto/data/

# Connection limits and timeouts
max_connections -1
max_queued_messages 1000
max_inflight_messages 20
# Default connection settings
timeout 30
keepalive 60

# Quality of Service
max_qos 2
set_tcp_nodelay true
allow_zero_length_clientid true

# Specify the log file
log_dest file /tmp/mosquitto/log/mosquitto.log
