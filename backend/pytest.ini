[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Custom markers
markers =
    integration: mark a test as an integration test requiring external services
    simulation: mark a test as a simulation test
    benchmark: mark a test as a benchmark/performance test
    hardware: mark a test as requiring actual Meshtastic hardware

# Log settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Disable warnings
filterwarnings =
    ignore::DeprecationWarning

# Default arguments for pytest
addopts = --verbose 